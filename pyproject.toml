[project]
name = "telegram-cli"
version = "0.1.0"
description = "Headless CLI for your own Telegram account (MTProto via Telethon, not a bot)"
requires-python = ">=3.12"
license = "MIT"
readme = "README.md"
dependencies = ["telethon>=1.40"]

[project.scripts]
telegram = "telegram_cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
only-include = ["telegram_cli.py"]
